name: La frase del día

on:
  push:
    branches: [main]
    paths:
      - "automation/**"
      - "automation/tests/**"
      - ".github/workflows/**"
      - "automation/requirements.txt"
      - "data/catalog.json"
  workflow_dispatch:
    inputs:
      mode:
        description: "Qué ejecutar"
        required: true
        default: tests
        type: choice
        options:
          - tests
          - weekly
          - poll
          - daily
  schedule:
    - cron: "13 18 * * 0"
      timezone: Europe/Paris
    - cron: "17 9 * * *"
      timezone: Europe/Paris
    - cron: "17 10 * * *"
      timezone: Europe/Paris
    - cron: "*/15 * * * *"
      timezone: Europe/Paris

permissions:
  contents: write

concurrency:
  group: frasedeldia-editorial-publishing
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install requirements
        run: |
          python -m pip install -r automation/requirements.txt
          ffmpeg -version | head -n 1

      - name: Offline regression tests
        run: python -m unittest discover -s automation/tests -v

      - name: Select and run scheduled task
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TEXT_MODEL: ${{ vars.GEMINI_TEXT_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PODCAST_OWNER_EMAIL: ${{ secrets.PODCAST_OWNER_EMAIL }}
          ENABLE_PUBLICATION: ${{ vars.ENABLE_PUBLICATION }}
          GH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          MODE="${INPUT_MODE:-tests}"
          if [ "$EVENT_NAME" = "schedule" ]; then
            case "$EVENT_SCHEDULE" in
              '13 18 * * 0') MODE=weekly ;;
              '17 9 * * *'|'17 10 * * *') MODE=daily ;;
              *) MODE=poll ;;
            esac
          fi
          echo "Mode: $MODE"
          if [ "$MODE" = "tests" ]; then
            exit 0
          fi
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::notice::Configure TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID to enable this project."
            exit 0
          fi
          if [ "$MODE" = "daily" ] && [ "$ENABLE_PUBLICATION" != "true" ]; then
            echo "::notice::Publication gated by ENABLE_PUBLICATION variable."
            exit 0
          fi
          if [ "$MODE" = "weekly" ] && [ -z "$GEMINI_API_KEY" ]; then
            echo "::notice::Configure GEMINI_API_KEY before creating proposals."
            exit 0
          fi
          python -m automation.runner "$MODE"

      - name: Save approvals and published episodes
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data public
          if ! git diff --cached --quiet; then
            git commit -m "bot: update editorial approvals and podcasts"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
