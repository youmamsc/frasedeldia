name: Generate four podcast pilots

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pilots.yml"
      - "episodes/**"
      - "src/**"
      - "requirements.txt"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frase-del-dia-pilots
  cancel-in-progress: false

jobs:
  pilots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: kokoro-82m-v1

      - name: Install dependencies and fallback tools
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install -r requirements.txt
          if ! command -v ffmpeg >/dev/null || ! command -v espeak >/dev/null || ! command -v espeak-ng >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg espeak espeak-ng
          fi

      - name: Check four scripts
        run: python -m unittest discover -s tests -v

      - name: Render four MP3 pilots
        run: python src/build_pilots.py

      - name: Preserve four MP3s for download
        uses: actions/upload-artifact@v4
        with:
          name: frase-del-dia-four-pilots
          path: output/
          if-no-files-found: error
          retention-days: 30

      - name: Publish preview MP3s on main branch
        run: |
          mkdir -p samples
          cp output/*.mp3 samples/
          cp output/manifest.json samples/manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add samples/
          if ! git diff --cached --quiet; then
            git commit -m "audio: publish four podcast preview episodes"
            git push origin HEAD:main
          fi
